<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Validation Test - Valid</title>
</head>
<body>
    <h1>Configuration Validation Test (Valid Config)</h1>
    <div id="results"></div>

    <script>
        // TEST: Valid configuration
        const CONFIG = {
            workspaceDir: 'carrinhos',
            startFile: 'index.md'
        };

        function validateConfiguration() {
            const errors = [];
            if (!CONFIG.workspaceDir || typeof CONFIG.workspaceDir !== 'string') {
                errors.push('workspaceDir must be a non-empty string');
            } else if (CONFIG.workspaceDir.trim() === '') {
                errors.push('workspaceDir cannot be empty or whitespace');
            }
            if (!CONFIG.startFile || typeof CONFIG.startFile !== 'string') {
                errors.push('startFile must be a non-empty string');
            } else if (CONFIG.startFile.trim() === '') {
                errors.push('startFile cannot be empty or whitespace');
            }
            return { isValid: errors.length === 0, errors };
        }

        const result = validateConfiguration();
        const resultsDiv = document.getElementById('results');

        if (result.isValid) {
            resultsDiv.innerHTML = `
                <p style="color:green;font-weight:bold;">✓ Test PASSED</p>
                <p>Configuration is valid:</p>
                <ul>
                    <li>workspaceDir: "${CONFIG.workspaceDir}"</li>
                    <li>startFile: "${CONFIG.startFile}"</li>
                </ul>
            `;
            console.log('✓ Validation correctly accepted valid config');
        } else {
            resultsDiv.innerHTML = '<p style="color:red;font-weight:bold;">✗ Test FAILED: Should have accepted valid config</p>';
            console.error('✗ Validation incorrectly rejected valid config:', result.errors);
        }
    </script>
</body>
</html>
